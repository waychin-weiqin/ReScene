[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rescene"
version = "0.1.0"
description = "Incremental scene chronology from sparse revisits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.15.3",
  "Pillow==12.3.0",
  "opencv-python==4.11.0.86",
  "lpips==0.1.4",
  "timm==1.0.30",
  "huggingface-hub==2.1.1",
  "h5py==3.16.0",
  "einops==0.8.2",
  "roma==1.6.1",
  "trimesh==5.1.1",
  "plyfile==1.1.2",
  "matplotlib==3.10.9",
  "tqdm==4.70.1",
  "tensorboard==2.21.0",
  "joblib==1.6.0",
  "scikit-learn==1.7.2",
  "future==1.0.0",
  "consoleprinter==95"
]

[project.scripts]
rescene = "rescene.cli:main"

[project.urls]
Repository = "https://github.com/waychin-weiqin/ReScene"

[tool.setuptools.packages.find]
include = ["rescene*"]

[tool.setuptools.package-data]
rescene = ["configs/*.json", "reproduction/*.json", "reproduction/real-alignment/*/*.json", "patches/*.patch", "patches/periodic-gs/*.patch"]
